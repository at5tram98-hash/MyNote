<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>NoteOne Prototype</title>
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/app.css" />
  <link rel="stylesheet" href="./css/editor.css" />
  <link rel="stylesheet" href="./css/mobile.css" />
  <link rel="stylesheet" href="./css/desktop.css" />
</head>
<body>
  <div id="app" class="app-shell" data-mode="auto">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-button mobile-only" id="backButton" aria-label="ノート一覧へ戻る">‹</button>
        <div class="brand desktop-only">NoteOne</div>
      </div>
      <div class="document-title-wrap">
        <input id="documentTitle" class="document-title" value="無題のノート" aria-label="ノートタイトル" />
        <span id="saveState" class="save-state">保存済み</span>
      </div>
      <div class="topbar-actions">
        <button class="ghost-button desktop-only" id="modeToggle" aria-label="表示モード変更">自動</button>
        <button class="icon-button" id="moreButton" aria-label="その他">•••</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="sidebar desktop-only" id="sidebar">
        <div class="sidebar-header">
          <div>
            <div class="eyebrow">LIBRARY</div>
            <h2>ノート</h2>
          </div>
          <button class="round-add" id="newNoteButton" aria-label="新しいノート">＋</button>
        </div>
        <div class="searchbox">
          <span>⌕</span>
          <input id="searchInput" type="search" placeholder="ノートを検索" />
        </div>
        <div class="sidebar-section">
          <button class="nav-row active"><span>▤</span><span>すべてのノート</span><b id="noteCount">0</b></button>
          <button class="nav-row"><span>★</span><span>お気に入り</span><b>0</b></button>
          <button class="nav-row"><span>◷</span><span>最近編集</span></button>
        </div>
        <div class="list-label">最近のノート</div>
        <div id="noteList" class="note-list"></div>
        <div class="sidebar-footer">
          <button class="sidebar-footer-button"><span>☁︎</span><span>Google Drive</span><em>未接続</em></button>
          <button class="sidebar-footer-button"><span>⚙</span><span>設定</span></button>
        </div>
      </aside>

      <section class="editor-stage" id="editorStage">
        <div class="toolbar desktop-only" role="toolbar" aria-label="書式設定">
          <div class="toolbar-group">
            <button data-command="bold" title="太字"><b>B</b></button>
            <button data-command="italic" title="斜体"><i>I</i></button>
            <button data-command="underline" title="下線"><u>U</u></button>
          </div>
          <div class="toolbar-divider"></div>
          <div class="toolbar-group">
            <select id="blockSelect" aria-label="段落スタイル">
              <option value="p">本文</option>
              <option value="h1">タイトル</option>
              <option value="h2">見出し1</option>
              <option value="h3">見出し2</option>
            </select>
          </div>
          <div class="toolbar-divider"></div>
          <div class="toolbar-group">
            <button data-command="insertUnorderedList" title="箇条書き">•≡</button>
            <button id="undoButton" title="元に戻す">↶</button>
            <button id="redoButton" title="やり直す">↷</button>
          </div>
          <div class="toolbar-spacer"></div>
          <button class="word-count" id="wordCount">0文字</button>
        </div>

        <div class="document-viewport">
          <article class="paper" id="paper">
            <div id="editor" class="editor" contenteditable="true" role="textbox" aria-multiline="true" spellcheck="true"></div>
          </article>
        </div>

        <div class="mobile-formatbar mobile-only" role="toolbar" aria-label="モバイル書式設定">
          <button id="mobileAdd">＋</button>
          <button data-command="bold"><b>B</b></button>
          <button data-command="italic"><i>I</i></button>
          <button id="mobileStyle">Aa</button>
          <button data-command="insertUnorderedList">•≡</button>
          <button id="mobileUndo">↶</button>
        </div>
      </section>

      <aside class="inspector desktop-only">
        <div class="inspector-tabs">
          <button class="active">文書</button><button>情報</button>
        </div>
        <div class="inspector-card">
          <div class="eyebrow">DOCUMENT</div>
          <h3>ノート設定</h3>
          <div class="setting-row"><span>モード</span><strong>Note</strong></div>
          <div class="setting-row"><span>背景</span><span class="swatch"></span></div>
          <div class="setting-row"><span>本文幅</span><strong>標準</strong></div>
        </div>
        <div class="inspector-card">
          <div class="eyebrow">STATUS</div>
          <div class="stats-grid">
            <div><b id="statChars">0</b><span>文字</span></div>
            <div><b id="statBlocks">0</b><span>段落</span></div>
          </div>
        </div>
        <div class="inspector-card drive-card">
          <div class="drive-icon">G</div>
          <div>
            <h3>Google Drive</h3>
            <p>あとからDrive / Docs同期を追加できる構造です。</p>
          </div>
          <button disabled>接続準備中</button>
        </div>
      </aside>
    </main>

    <div id="mobileLibrary" class="mobile-library mobile-only">
      <div class="mobile-library-header">
        <div>
          <div class="eyebrow">LIBRARY</div>
          <h1>ノート</h1>
        </div>
        <button class="round-add" id="mobileNewNote">＋</button>
      </div>
      <div class="searchbox"><span>⌕</span><input id="mobileSearch" placeholder="ノートを検索" /></div>
      <div id="mobileNoteList" class="mobile-note-list"></div>
    </div>

    <div id="styleSheet" class="sheet-backdrop mobile-only" hidden>
      <div class="bottom-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">テキスト</div>
        <button data-block="p">本文 <span>✓</span></button>
        <button data-block="h1">タイトル</button>
        <button data-block="h2">見出し1</button>
        <button data-block="h3">見出し2</button>
      </div>
    </div>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
